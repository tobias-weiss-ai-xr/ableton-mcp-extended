name: Ableton MCP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Ruff Check (new code - strict)
        run: ruff check agentic_mix/ tests/
      - name: Run Ruff Check (existing code - pre-existing allowed)
        run: ruff check MCP_Server/ --ignore=E402,F821,E722 || true
      - name: Run Python Compileall
        run: python -m compileall MCP_Server

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Pytest
        run: pytest tests/ --ignore=tests/test_integration_test.py -v
